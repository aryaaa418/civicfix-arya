<!DOCTYPE html>
<html>
<head>
    <title>Smart Civic Admin Dashboard</title>
    <style>
        body { font-family: Arial; background:#f4f6f8; margin:0; padding:30px; }
        .cards { display:grid; grid-template-columns:repeat(5,1fr); gap:15px; }
        .card { background:white; padding:20px; border-radius:12px; box-shadow:0 3px 10px #ddd; }
        .number { font-size:30px; font-weight:bold; }
        table { width:100%; margin-top:30px; background:white; border-collapse:collapse; }
        th,td { padding:14px; border-bottom:1px solid #ddd; text-align:left; }
        select { padding:7px; }
    </style>
</head>
<body>
<h1>🏙️ Smart Civic Admin Dashboard</h1>

<div class="cards">
    <div class="card"><h3>Total</h3><div id="total" class="number">0</div></div>
    <div class="card"><h3>Pending</h3><div id="pending" class="number">0</div></div>
    <div class="card"><h3>In Progress</h3><div id="progress" class="number">0</div></div>
    <div class="card"><h3>Resolved</h3><div id="resolved" class="number">0</div></div>
    <div class="card"><h3>Duplicates</h3><div id="duplicates" class="number">0</div></div>
</div>

<table>
<thead><tr>
<th>ID</th><th>Complaint</th><th>Category</th><th>Priority</th>
<th>Department</th><th>Location</th><th>Status</th>
</tr></thead>
<tbody id="complaints"></tbody>
</table>

<script>
const API = "http://localhost:5000/api/admin";

async function loadDashboard() {
    const stats = await (await fetch(`${API}/stats`)).json();

    document.getElementById("total").innerText = stats.total;
    document.getElementById("pending").innerText = stats.pending;
    document.getElementById("progress").innerText = stats.inProgress;
    document.getElementById("resolved").innerText = stats.resolved;
    document.getElementById("duplicates").innerText = stats.duplicates;

    const complaints = await (await fetch(`${API}/complaints`)).json();
    const tbody = document.getElementById("complaints");
    tbody.innerHTML = "";

    complaints.forEach(c => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${c.id}</td>
            <td>${c.title}</td>
            <td>${c.category}</td>
            <td>${c.priority}</td>
            <td>${c.department || "Unassigned"}</td>
            <td>${c.address || "GPS location"}</td>
            <td>
                <select onchange="updateStatus(${c.id}, this.value)">
                    <option ${c.status==="PENDING"?"selected":""}>PENDING</option>
                    <option ${c.status==="IN_PROGRESS"?"selected":""}>IN_PROGRESS</option>
                    <option ${c.status==="RESOLVED"?"selected":""}>RESOLVED</option>
                    <option ${c.status==="REJECTED"?"selected":""}>REJECTED</option>
                </select>
            </td>`;
        tbody.appendChild(row);
    });
}

async function updateStatus(id, status) {
    await fetch(`${API}/complaints/${id}/status`, {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({status})
    });
    loadDashboard();
}

loadDashboard();
</script>
</body>
</html>
